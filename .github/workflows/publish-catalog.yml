name: Publish plugin catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "packages/catalog/**"
      - "scripts/build-catalog.ts"
      - "scripts/publish-catalog.ts"
      - ".github/workflows/publish-catalog.yml"

concurrency:
  group: publish-plugin-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build catalog snapshot
        run: pnpm catalog:build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate catalog packages
        run: |
          pnpm --filter @dshhub/catalog test
          pnpm --filter @dshhub/catalog typecheck
          pnpm --filter @dshhub/api test

      - name: Publish snapshot to Cloudflare
        run: pnpm catalog:publish
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_INGEST_TOKEN: ${{ secrets.CATALOG_INGEST_TOKEN }}

      - name: Commit generated README catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(catalog): refresh generated index"
            git push
          fi
