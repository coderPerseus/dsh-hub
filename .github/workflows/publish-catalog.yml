name: Publish plugin catalog
run-name: "Catalog ${{ github.event_name == 'schedule' && 'daily sync' || github.event_name == 'push' && 'site publish' || inputs.mode }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Catalog operation
        default: publish
        type: choice
        options: [publish, discover, refresh, backfill]
      since:
        description: ISO timestamp for backfill
        type: string
      repository:
        description: Optional owner/repo to discover
        type: string
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/client/**', 'packages/catalog/**', 'scripts/**', '.github/workflows/publish-catalog.yml', 'pnpm-lock.yaml']
concurrency:
  group: publish-plugin-catalog
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: de7749886db8f5df040c27a20388fdcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore durable catalog
        run: pnpm --filter @dshhub/web exec tsx ../../scripts/restore-catalog.mts
        working-directory: .
      - name: Update catalog offline
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        run: |
          pnpm catalog:build
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then CATALOG_MODE=refresh pnpm catalog:build; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_MODE: ${{ inputs.mode || 'discover' }}
          CATALOG_REPOSITORY: ${{ inputs.repository }}
          CATALOG_DISCOVERY_SINCE: ${{ inputs.since }}
          CATALOG_SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify and build static site
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @dshhub/web build
      - name: Deploy static assets only
        run: OPEN_NEXT_DEPLOY=true pnpm --filter @dshhub/web exec wrangler deploy --config wrangler.ci.jsonc
      - name: Save successful catalog snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c .catalog/catalog.snapshot.json > .catalog/catalog.snapshot.json.gz
          tag="catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" .catalog/catalog.snapshot.json.gz --title "$tag" --notes 'Verified static catalog backup.' --latest=false
          gh release upload catalog-current .catalog/catalog.snapshot.json.gz --clobber
