name: Publish plugin catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Catalog operation
        required: true
        default: discover
        type: choice
        options:
          - discover
          - refresh
      repository:
        description: Optional owner/repo to discover
        required: false
        type: string
      translate:
        description: Translate changed plugin documentation
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 * * * *"
    - cron: "37 3 * * 0"
  push:
    branches: [main]
    paths:
      - "packages/catalog/**"
      - "scripts/build-catalog.ts"
      - "scripts/translate-catalog.ts"
      - "scripts/publish-catalog.ts"
      - ".github/workflows/publish-catalog.yml"

concurrency:
  group: publish-plugin-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build catalog snapshot
        run: pnpm catalog:build
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_INGEST_TOKEN: ${{ secrets.CATALOG_INGEST_TOKEN }}
          CATALOG_MIN_PLUGIN_COUNT: "50"
          CATALOG_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '37 3 * * 0' && 'refresh' || 'discover') }}
          CATALOG_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || '' }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore catalog translation cache
        uses: actions/cache@v4
        with:
          path: .catalog/i18n-cache.json
          key: catalog-i18n-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            catalog-i18n-${{ runner.os }}-

      - name: Translate catalog snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.translate }}
        run: pnpm catalog:translate -- --concurrency 10
        env:
          NEW_API_KEY: ${{ secrets.NEW_API_KEY }}
          NEW_API_URL: ${{ secrets.NEW_API_URL }}

      - name: Validate catalog packages
        run: |
          pnpm --filter @dshhub/catalog test
          pnpm --filter @dshhub/catalog typecheck
          pnpm --filter @dshhub/api test

      - name: Publish snapshot to Cloudflare
        run: pnpm catalog:publish
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_INGEST_TOKEN: ${{ secrets.CATALOG_INGEST_TOKEN }}

      - name: Commit generated README catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(catalog): refresh generated index"
            git pull --rebase origin main
            git push
          fi
